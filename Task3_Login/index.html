<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <h2>
            <img src="book.svg" alt="Book">
            Student <span>Portal</span>
        </h2>

        <p>Learn Today,<br>Build Your Tomorrow</p>

        <div class="books">
            <img src="plant.svg" alt="Plant">
            <img src="books.svg" alt="Books">
        </div>
    </div>

    <div class="right">
        <h1>Welcome Back!</h1>
        <p>Login to your account to continue<br>learning and growing.</p>

        <div class="input-box">
            <img src="email.svg" alt="Email">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-box">
            <img src="lock.svg" alt="Password">
            <input type="password" placeholder="Password">
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember me
            </label>
            <a href="#">Forgot Password?</a>
        </div>

        <button>Login</button>

        <p class="signup">
            Don't have an account? <a href="#">Sign Up</a>
        </p>
    </div>

</div>

</body>
</html>
