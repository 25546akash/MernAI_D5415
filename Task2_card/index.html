<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="product">
    <div class="card">

        <b class="new">NEW</b>

        <div class="image">
            <img src="product4.png" alt="Propeller Fan">
            <b class="off">50% OFF</b>
            <b class="sale">SALE</b>
        </div>

        <h2>Propeller Fan</h2>
        <h3>₹999</h3>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
